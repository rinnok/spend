<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes">
<title>使ったお金</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f2f4f6;--surface:#ffffff;--ink:#1b2430;--muted:#6b7480;--line:#d9dee4;
  --accent:#1f7a8c;--cash:#b8860b;--wise:#2f8f5b;--card:#5b6470;--danger:#b23a48;--settle:#8a4fbf;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a20;--surface:#1d242c;--ink:#e9edf1;--muted:#98a2ad;--line:#2d3640;
  --accent:#4fb3c4;--cash:#e0b53a;--wise:#5cc98a;--card:#9aa4b0;--danger:#e2707c;--settle:#b78ae6;}}
:root[data-theme="dark"]{
  --bg:#141a20;--surface:#1d242c;--ink:#e9edf1;--muted:#98a2ad;--line:#2d3640;
  --accent:#4fb3c4;--cash:#e0b53a;--wise:#5cc98a;--card:#9aa4b0;--danger:#e2707c;--settle:#b78ae6;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans JP",system-ui,sans-serif;font-size:16px;padding:16px;padding-block:20px 40px;max-width:520px;margin-inline:auto}
h1{font-size:18px;margin:0 0 12px;font-weight:700;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-size:12px;color:var(--muted);font-weight:400}
#cloud{margin-right:6px}#cloud.ok{color:var(--wise)}#cloud.wait{color:var(--cash)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tot .lb{font-size:11px;color:var(--muted);letter-spacing:.08em}
.tot .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.tot .yen{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:1px}
.tot .sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.tot.cash .v{color:var(--cash)}.tot.wise .v{color:var(--wise)}.tot.card .v{color:var(--card)}
.tot .v.neg{color:var(--danger)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.stat .lb{font-size:11px;color:var(--muted);letter-spacing:.08em}
.stat .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px}
.stat .yen{font-size:12px;color:var(--muted);margin-left:4px;font-family:"IBM Plex Sans JP",sans-serif;font-weight:400}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.plan summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:14px;-webkit-tap-highlight-color:transparent}
.plan summary::-webkit-details-marker{display:none}
.plan summary .lb{color:var(--muted)}.plan summary .lb::before{content:"▶ ";font-size:10px}
.plan[open] summary .lb::before{content:"▼ "}
.plan summary .v{font-family:"IBM Plex Mono",monospace;font-weight:600}
.plan .free{padding:0 12px 8px;font-size:12px;color:var(--muted)}
.plan .free b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.plan ul{margin:0;padding:0 8px 8px;display:grid;gap:4px}
.plan li{grid-template-columns:auto 1fr auto;padding:8px 10px;font-size:14px;border:0;background:var(--bg)}
.plan li.done{opacity:.45;text-decoration:line-through}
.plan li input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.plan li .d{color:var(--muted);font-size:12px;margin-right:6px}
.plan li .est{color:var(--muted);font-size:11px;margin-left:4px}
.plan li .go{font-family:"IBM Plex Mono",monospace;font-weight:600;cursor:pointer;color:var(--accent)}
.plan li{grid-template-columns:auto 1fr auto auto}
.plan li .x{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 2px}
.plan .add{display:grid;grid-template-columns:1fr 70px 78px auto;gap:6px;padding:4px 8px 8px}
.plan .add input,.plan .add select{font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.plan .add button{font:inherit;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:0 12px;cursor:pointer}
.plan .tip{padding:0 12px 10px;font-size:11px;color:var(--muted)}
.settle{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--settle);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.settle .lb{font-size:13px;color:var(--settle);font-weight:700}
.settle .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;color:var(--settle)}
.settle .v .yen{font-size:12px;color:var(--muted);font-family:"IBM Plex Sans JP",sans-serif;font-weight:400;margin-left:4px}
.settle[hidden]{display:none}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.amt{display:flex;align-items:center;gap:8px}
.amt span{font-size:22px;color:var(--muted)}
.amt .yen{font-size:13px;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
input[type=number],input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
input[type=number]{font-family:"IBM Plex Mono",monospace;font-size:28px;font-weight:600;padding:8px 12px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.methods button{font:inherit;font-weight:700;padding:14px 0;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.methods button[aria-pressed=true]{border-color:currentColor;background:var(--surface)}
.methods .m-cash[aria-pressed=true]{color:var(--cash)}.methods .m-wise[aria-pressed=true]{color:var(--wise)}.methods .m-card[aria-pressed=true]{color:var(--card)}
.split{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 2px;cursor:pointer;user-select:none}
.split input{width:22px;height:22px;accent-color:var(--settle);margin:0}
.split .hint{color:var(--muted);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.save{font:inherit;font-weight:700;font-size:17px;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.save:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,.tot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:6px}
li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
li.day{display:block;background:none;border:0;padding:8px 2px 0;font-size:12px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
li .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
li .tag.cash{color:var(--cash)}li .tag.wise{color:var(--wise)}li .tag.card{color:var(--card)}
li .note{overflow-wrap:anywhere}
li .note small{color:var(--muted);display:block;font-size:12px}
li .note .sp{color:var(--settle);font-size:11px;font-weight:700;margin-left:6px}
li .amt2{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
li .del{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px}
li .del:hover{color:var(--danger)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;color:var(--muted)}
.foot button{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
</style>

<h1>使ったお金（€）<small><span id="cloud" title="Google に自動保存">☁</span> €1 = ¥<span id="rate">180</span></small></h1>
<div class="totals">
  <div class="tot cash" id="tile-cash" role="button" tabindex="0" title="タップで持ってきた額を変更"><div class="lb">現金 残り</div><div class="v" id="r-cash">350</div><div class="yen" id="ry-cash">¥63,000</div><div class="sub" id="s-cash">/ 350</div></div>
  <div class="tot wise" id="tile-wise" role="button" tabindex="0" title="タップで入金額を変更"><div class="lb">Wise 残り</div><div class="v" id="r-wise">784.1</div><div class="yen" id="ry-wise">¥141,138</div><div class="sub" id="s-wise">/ 784.1</div></div>
  <div class="tot card" id="tile-card"><div class="lb">他クレカ</div><div class="v" id="r-card">0</div><div class="yen" id="ry-card">¥0</div><div class="sub">使った額</div></div>
</div>
<div class="stats">
  <div class="stat"><div class="lb">今日</div><div class="v">€<span id="t-today">0</span><span class="yen" id="y-today">¥0</span></div></div>
  <div class="stat"><div class="lb">旅行合計</div><div class="v">€<span id="t-all">0</span><span class="yen" id="y-all">¥0</span></div></div>
</div>

<details class="plan" id="plan">
  <summary><span class="lb">これから払う予定（1人分）</span><span class="v">€<span id="plan-total">0</span></span></summary>
  <div class="free">現金で払う予定 €<b id="plan-cash">0</b> → 現金の残りから引くと <b id="plan-free">0</b></div>
  <ul id="plan-list"></ul>
  <div class="add"><input id="p-name" placeholder="何に" aria-label="予定の名前"><input id="p-amt" type="number" inputmode="decimal" step="0.01" placeholder="€" aria-label="予定の金額"><select id="p-m" aria-label="支払い"><option value="cash">現金</option><option value="wise">Wise</option><option value="card">他クレカ</option></select><button type="button" id="p-add">追加</button></div>
  <div class="tip">払ったらチェック。金額をタップすると入力欄に入る。「目安」は変わりうる額</div>
</details>

<form id="f">
  <div class="amt"><span>€</span><input type="number" id="amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" aria-label="金額（ユーロ）"><span class="yen" id="amt-yen"></span></div>
  <div class="methods" role="group" aria-label="支払い方法">
    <button type="button" class="m-cash" data-m="cash" aria-pressed="true">現金</button>
    <button type="button" class="m-wise" data-m="wise" aria-pressed="false">Wise</button>
    <button type="button" class="m-card" data-m="card" aria-pressed="false">他クレカ</button>
  </div>
  <input type="text" id="note" placeholder="何に（任意）" aria-label="何に使ったか">
  <button class="save" id="save" type="submit" disabled>記録する</button>
</form>

<ul id="list"></ul>
<div class="foot">
  <span id="count"></span>
  <span><button type="button" id="copy">コピー</button> <button type="button" id="clear">全消去</button></span>
</div>

<script>
(function(){
  const KEY='italy2026-spend', BKEY='italy2026-budget-v2';
  const RATE=180;
  const NAMES={cash:'現金',wise:'Wise',card:'他クレカ'};
  let items=[]; try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
  let budget={cash:350,wise:784.1}; try{Object.assign(budget,JSON.parse(localStorage.getItem(BKEY)||'{}'))}catch(e){}
  let method='cash';

  // ---- Google フォームへ自動保存（送信のみ・ログイン不要） ----
  const FORM='https://docs.google.com/forms/d/e/1FAIpQLScz4BhJHB4aUucM7cSd8Qkxbp9m3nHway8xY3bDmR9PzbegtA/formResponse';
  const E={id:'entry.1555918853',amount:'entry.1476210278',pay:'entry.1252554324',what:'entry.1163553848'};
  const QKEY='italy2026-spend-queue';
  let queue=[]; try{queue=JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){queue=[]}
  function qsave(){try{localStorage.setItem(QKEY,JSON.stringify(queue))}catch(e){}}
  function cloud(state,text){const c=$('cloud');c.className=state;c.textContent=text;}
  function enqueue(rec){queue.push(rec);qsave();flush();}
  let flushing=false;
  async function flush(){
    if(flushing)return; if(!queue.length){cloud('ok','☁ 保存済');return;}
    if(!navigator.onLine){cloud('wait','☁ 未送信 '+queue.length);return;}
    flushing=true;cloud('wait','☁ 送信中');
    while(queue.length){
      const r=queue[0];const fd=new FormData();
      fd.append(E.id,r.id);fd.append(E.amount,r.amount);fd.append(E.pay,r.pay);fd.append(E.what,r.what);
      try{await fetch(FORM,{method:'POST',mode:'no-cors',body:fd});queue.shift();qsave();}
      catch(e){break;}
    }
    flushing=false;
    if(queue.length){cloud('wait','☁ 未送信 '+queue.length);}else{cloud('ok','☁ 保存済');}
  }
  window.addEventListener('online',flush);
  setInterval(()=>{if(queue.length)flush()},60000);
  const $=id=>document.getElementById(id);
  const fmt=n=>(Math.round(n*100)/100).toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:2});
  const yen=n=>'¥'+Math.round(n*RATE).toLocaleString('en');
  const two=n=>String(n).padStart(2,'0');
  const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())};
  const dayLabel=k=>{const [y,m,d]=k.split('-');const w='日月火水木金土'[new Date(+y,m-1,+d).getDay()];return (+m)+'/'+(+d)+'（'+w+'）'};
  const hm=t=>{const d=new Date(t);return two(d.getHours())+':'+two(d.getMinutes())};
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(BKEY,JSON.stringify(budget))}catch(e){}}
  function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function render(){
    const t={cash:0,wise:0,card:0};let all=0,today=0,settle=0;const tk=dayKey(Date.now());
    items.forEach(i=>{t[i.m]+=i.a;all+=i.a;if(dayKey(i.t)===tk)today+=i.a;if(i.s)settle+=i.a/2});
    const rc=budget.cash-t.cash, rw=budget.wise-t.wise;
    $('r-cash').textContent=fmt(rc);$('r-cash').classList.toggle('neg',rc<0);$('ry-cash').textContent=yen(rc);$('s-cash').textContent='/ '+fmt(budget.cash)+'・使った '+fmt(t.cash);
    $('r-wise').textContent=fmt(rw);$('r-wise').classList.toggle('neg',rw<0);$('ry-wise').textContent=yen(rw);$('s-wise').textContent='/ '+fmt(budget.wise)+'・使った '+fmt(t.wise);
    $('r-card').textContent=fmt(t.card);$('ry-card').textContent=yen(t.card);
    $('t-today').textContent=fmt(today);$('y-today').textContent=yen(today);
    $('t-all').textContent=fmt(all);$('y-all').textContent=yen(all);
        const ul=$('list');ul.innerHTML='';
    if(!items.length){ul.innerHTML='<li class="empty" style="display:block">まだ記録なし。金額を入れて「記録する」</li>';}
    let lastDay=null;
    [...items].sort((a,b)=>b.t-a.t).forEach(i=>{
      const k=dayKey(i.t);
      if(k!==lastDay){lastDay=k;const h=document.createElement('li');h.className='day';h.textContent=dayLabel(k);ul.appendChild(h);}
      const li=document.createElement('li');
      li.innerHTML='<span class="tag '+i.m+'">'+NAMES[i.m]+'</span><span class="note">'+(i.n?esc(i.n):'<span style="color:var(--muted)">—</span>')+(i.s?'<span class="sp">立替½</span>':'')+'<small>'+hm(i.t)+'・'+yen(i.a)+'</small></span><span class="amt2">€'+fmt(i.a)+'</span><button class="del" aria-label="削除" data-id="'+i.t+'">×</button>';
      ul.appendChild(li);
    });
    $('count').textContent=items.length+' 件';
    if(typeof renderPlan==='function'&&$('plan-list'))renderPlan();
  }
  function editBudget(k,label){
    const v=prompt(label+'（€）',budget[k]);if(v===null)return;const n=parseFloat(v);if(!(n>=0))return;budget[k]=n;persist();render();
  }
  $('tile-cash').addEventListener('click',()=>editBudget('cash','持ってきた現金'));
  $('tile-wise').addEventListener('click',()=>editBudget('wise','Wise に入れた額'));
  [$('tile-cash'),$('tile-wise')].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}));
  document.querySelectorAll('.methods button').forEach(b=>b.addEventListener('click',()=>{
    method=b.dataset.m;document.querySelectorAll('.methods button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('amount').focus();
  }));
  function onAmount(){const a=parseFloat($('amount').value);const ok=a>0;$('save').disabled=!ok;$('amt-yen').textContent=ok?'≈ '+yen(a):'';void 0}
  $('amount').addEventListener('input',onAmount);
  $('f').addEventListener('submit',e=>{
    e.preventDefault();const a=parseFloat($('amount').value);if(!(a>0))return;
    const rec={t:Date.now(),a:a,m:method,n:$('note').value.trim()};items.push(rec);persist();render();
    enqueue({id:String(rec.t),amount:String(a),pay:NAMES[method],what:(rec.n||'')+' ['+dayKey(rec.t)+' '+hm(rec.t)+']'});
    $('amount').value='';$('note').value='';onAmount();$('amount').focus();
  });
  $('list').addEventListener('click',e=>{
    const b=e.target.closest('.del');if(!b)return;
    items=items.filter(i=>String(i.t)!==b.dataset.id);persist();render();
    enqueue({id:b.dataset.id,amount:'',pay:'',what:'削除'});
  });
  $('clear').addEventListener('click',()=>{if(confirm('記録を全部消しますか？'))(items=[],persist(),render())});
  $('copy').addEventListener('click',()=>{
    const txt=[...items].sort((a,b)=>a.t-b.t).map(i=>dayKey(i.t)+' '+hm(i.t)+'\t'+NAMES[i.m]+'\t'+i.a+'\t'+(i.s?'立替½':'')+'\t'+(i.n||'')).join('\n');
    navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>{$('copy').textContent='コピー済';setTimeout(()=>$('copy').textContent='コピー',1200)});
  });

  // ---- 予定支出 ----
  const PKEY='italy2026-plan-done';
  const PLAN=[
    {k:'conv',d:'9/20',n:'修道院 宿泊費（到着時払い）',a:110,m:'wise'},
    {k:'convtax',d:'9/22',n:'修道院 市税',a:8,m:'cash'},
    {k:'brun',d:'9/21',n:'Brunelleschi Pass',a:30,m:'wise'},
    {k:'roll',d:'9/22',n:'Rolling Venice',a:6,m:'cash'},
    {k:'vap',d:'9/22',n:'ヴァポレット72h（Rolling価格）',a:27,m:'wise'},
    {k:'vetax',d:'9/22',n:'ヴェネツィア 市税',a:12,m:'cash'},
    {k:'gond',d:'9/23',n:'ゴンドラ（€90の半分）',a:45,m:'cash'},
    {k:'dinner',d:'9/23',n:'記念日ディナー',a:60,m:'wise',est:1},
    {k:'mitax',d:'9/25',n:'ミラノ 市税',a:9.5,m:'cash'},
    {k:'food',d:'毎日',n:'食費の目安 €23.5×10日',a:235,m:'wise',est:1}
  ];
  let done={}; try{done=JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){done={}}
  const CKEY='italy2026-plan-custom',HKEY='italy2026-plan-hidden';
  let custom=[]; try{custom=JSON.parse(localStorage.getItem(CKEY)||'[]')}catch(e){custom=[]}
  let hidden={}; try{hidden=JSON.parse(localStorage.getItem(HKEY)||'{}')}catch(e){hidden={}}
  function psave(){try{localStorage.setItem(PKEY,JSON.stringify(done));localStorage.setItem(CKEY,JSON.stringify(custom));localStorage.setItem(HKEY,JSON.stringify(hidden))}catch(e){}}
  const allPlan=()=>PLAN.filter(p=>!hidden[p.k]).concat(custom);
  function renderPlan(){
    let tot=0,cash=0;const ul=$('plan-list');ul.innerHTML='';
    allPlan().forEach(p=>{
      const ok=!!done[p.k]; if(!ok){tot+=p.a;if(p.m==='cash')cash+=p.a;}
      const li=document.createElement('li');li.className=ok?'done':'';
      li.innerHTML='<input type="checkbox" data-k="'+p.k+'"'+(ok?' checked':'')+' aria-label="払った"><span><span class="d">'+p.d+'</span>'+p.n+(p.est?'<span class="est">目安</span>':'')+'</span><span class="go" data-a="'+p.a+'" data-m="'+p.m+'" data-n="'+p.n.replace(/"/g,'')+'">€'+fmt(p.a)+'</span><button class="x" data-x="'+p.k+'" aria-label="予定を消す">×</button>';
      ul.appendChild(li);
    });
    $('plan-total').textContent=fmt(tot);$('plan-cash').textContent=fmt(cash);
    const spent=items.filter(i=>i.m==='cash').reduce((x,i)=>x+i.a,0);
    const free=budget.cash-spent-cash;$('plan-free').textContent=(free<0?'−':'')+'€'+fmt(Math.abs(free))+(free<0?'（足りない）':'');
  }
  $('plan-list').addEventListener('change',e=>{const c=e.target.closest('input[data-k]');if(!c)return;done[c.dataset.k]=c.checked;psave();renderPlan();});
  $('plan-list').addEventListener('click',e=>{const x=e.target.closest('.x');if(!x)return;const k=x.dataset.x;if(custom.some(c=>c.k===k))custom=custom.filter(c=>c.k!==k);else hidden[k]=1;psave();renderPlan();});
  $('p-add').addEventListener('click',()=>{const a=parseFloat($('p-amt').value);const n=$('p-name').value.trim();if(!(a>0)||!n)return;custom.push({k:'c'+Date.now(),d:'',n:n,a:a,m:$('p-m').value});psave();renderPlan();$('p-name').value='';$('p-amt').value='';});
  $('plan-list').addEventListener('click',e=>{const g=e.target.closest('.go');if(!g)return;$('amount').value=g.dataset.a;$('note').value=g.dataset.n;method=g.dataset.m;document.querySelectorAll('.methods button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===method));onAmount();$('plan').open=false;$('amount').focus();window.scrollTo({top:0,behavior:'smooth'});});
  render();flush();renderPlan();
})();
</script>
